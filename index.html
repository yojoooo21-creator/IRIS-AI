<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS - AI Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #05050a; color: #fff; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 430px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 50px; }
        
        .card { background: #0a0f1d; border: 1px solid rgba(0,242,254,0.3); border-radius: 16px; padding: 18px; box-shadow: 0 0 15px rgba(0,242,254,0.1); }
        .title { font-size: 16px; font-weight: 700; color: #00f2fe; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .chat-box { height: 250px; background: #030508; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1.4; }
        .msg.incoming { background: #191e30; align-self: flex-start; }
        .msg.outgoing { background: #0072ff; color: #fff; align-self: flex-end; }

        .input-group { display: flex; gap: 8px; }
        input, button { padding: 10px 14px; border-radius: 10px; font-size: 13px; outline: none; }
        input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
        button { background: #00f2fe; border: none; color: #05050a; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <!-- قسم الترحيب -->
        <div class="card" style="text-align: center;">
            <h2 style="color: #00f2fe; margin-bottom: 5px;">IRIS AI Assistant</h2>
            <p style="font-size: 12px; color: #94a3b8;">المساعد الشخصي الذكي (نسخة مستقرة)</p>
        </div>

        <!-- إعدادات المفتاح -->
        <div class="card">
            <div class="title"><i class="fa-solid fa-key"></i> إعدادات الـ API Key</div>
            <div class="input-group">
                <input type="password" id="apiKey" placeholder="أدخل مفتاح Gemini هنا...">
                <button onclick="saveKey()">حفظ</button>
            </div>
        </div>

        <!-- الشات -->
        <div class="card">
            <div class="title"><i class="fa-solid fa-comments"></i> المحادثة الذكية</div>
            <div class="chat-box" id="chatBox">
                <div class="msg incoming">أهلاً يا يوسف! أدخل مفتاح الـ API فوق واكتب سؤالك بالأسفل.</div>
            </div>
            <div class="input-group">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // تحميل المفتاح القديم إن وجد
        let savedKey = localStorage.getItem('iris_key') || '';
        if(savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }

        function saveKey() {
            let key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('iris_key', key);
            alert('تم حفظ المفتاح محلياً بنجاح!');
        }

        async function sendMsg() {
            let input = document.getElementById('chatInput');
            let text = input.value.trim();
            if(!text) return;

            let box = document.getElementById('chatBox');
            box.innerHTML += `<div class="msg outgoing">${text}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            let key = localStorage.getItem('iris_key');
            if(!key) {
                box.innerHTML += `<div class="msg incoming">من فضلك أدخل مفتاح الـ API في خانة الإعدادات بالأعلى أولاً!</div>`;
                box.scrollTop = box.scrollHeight;
                return;
            }

            box.innerHTML += `<div class="msg incoming" id="loading">جاري الرد...</div>`;
            box.scrollTop = box.scrollHeight;

            try {
                let res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                });
                let data = await res.json();
                
                document.getElementById('loading').remove();
                
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    let reply = data.candidates[0].content.parts[0].text;
                    box.innerHTML += `<div class="msg incoming">${reply}</div>`;
                } else if(data.error) {
                    box.innerHTML += `<div class="msg incoming">خطأ من جوجل: ${data.error.message}</div>`;
                } else {
                    box.innerHTML += `<div class="msg incoming">عذراً، لم أتمكن من جلب الرد. تأكد من صحة المفتاح.</div>`;
                }
            } catch(e) {
                document.getElementById('loading').remove();
                box.innerHTML += `<div class="msg incoming">فشل الاتصال بالإنترنت.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
